issues:
  - title: "Register and ship generic-format adapters (`features-json`, `features-csv`, `features-tsv`, `bed`)"
    labels: ["next"]
    body: |
      **Context**
      `features-json`, `features-csv`, `features-tsv`, and `bed` are declared as canonical names in the `KnownAdapterName` union in `src/schema/types.ts`, and the file-extension shorthand in `src/schema/normalize.ts` infers them (`.csv → features-csv`, `.tsv → features-tsv`, `.json → features-json`, `.bed → bed`). But no runtime registration of these adapters exists — `registerBuiltinAdapters()` appears only in doc comments in `src/schema/registry.ts`. As a result, a config that relies on the inference (e.g. `data: "./x.csv"`) infers `adapter: features-csv` and then fails at validate/load time with "Unknown adapter" because no such adapter is registered.

      If we want the bring-your-own-CSV authoring workflow to actually work end-to-end, these adapters need a real implementation.

      **Task**
      Implement and register the four generic-format adapters so they are available out of the box on the `<protvista-uniprot>` element.

      **Scope:**
      * Add `src/schema/adapters/features-json.ts` — parses an array of feature-shaped records already in the expected shape. Happy path + malformed input (non-array, wrong field types) unit tests.
      * Add `src/schema/adapters/features-csv.ts` — parses CSV with header row `type,start,end,description[,score]`. Uses the existing `d3-dsv` dependency (no new dep).
      * Add `src/schema/adapters/features-tsv.ts` — same column convention, tab-separated. Shares the parser core with `features-csv`.
      * Add `src/schema/adapters/bed.ts` — standard BED (tab-separated). At minimum BED3 (chrom/start/end); ideally up to BED6 for score + strand.
      * Implement `registerBuiltinAdapters(registry)` in `src/schema/registry.ts` and call it from the default registry factory so the adapters are pre-registered before any config loads.
      * Reinstate the deleted spec material in `specs/config-approach.md`: Example 4 (bring-your-own CSV + transform pipeline), the Edge Cases row for malformed generic-format-adapter input, and the corresponding acceptance criteria.
      * Each adapter has a unit test covering happy path and at least one malformed-input case, producing a descriptive error that identifies the offending row/column.

      **Notes:**
      The payload shape these adapters produce should match what the resolved semantic-kind adapter consumer expects (feature-shaped records with `type`, `start`/`begin`, `end`, `description`, optional `score`). Validate against the existing nightingale-track-canvas component to confirm tracks render without any per-track glue code from the author.
    fields:
      Group: "Technical"

  - title: "Emit per-track summary `console.warn` for missing `dataTooltip` field references"
    labels: ["next"]
    body: |
      **Context**
      After the first render pass, a single summary `console.warn` lists all missing fields for that track, not per data point. `src/tooltips/resolve.ts` silently substitutes missing fields as empty strings (which is correct behaviour at the per-cell level), but authors get no feedback when a `dataTooltip` template references a field the adapter never produced. This is a common foot-gun when authoring against an unfamiliar data source: the tooltip renders blank cells and the author has no breadcrumbs to the cause.

      **Task**
      Implement a per-track missing-field accumulator in the tooltip resolver and emit one summary `console.warn` per track, not per data point.

      **Scope:**
      * In `src/tooltips/resolve.ts` (or a helper), track the set of field paths that resolved to `undefined` while rendering any tooltip on a given track during a render pass.
      * After the render pass completes (or on the next animation frame — whichever is cheaper), emit a single `console.warn` of the form: `"[protvista-uniprot] Track <groupId>/<trackId>: dataTooltip references unknown fields: <field>, <field>, …"`. The warning fires once per track per render pass, not per data point.
      * Don't warn when the field resolves to a legitimate empty string / `null` — only when the field *path* doesn't exist on any of the track's data points.
      * Integrate the accumulator with both `kind: fields` and `kind: markdown` authoring forms.
      * Add a unit test in `src/tooltips/__spec__/resolve.spec.ts` that: (a) renders a tooltip template referencing three unknown fields across ten data points, and (b) asserts `console.warn` was called exactly once with all three field names.
      * Reinstate the deleted spec material in `specs/config-approach.md`: the Edge Cases row and the acceptance criterion.

      **Notes:**
      Keep the allocation/accounting path on the hot render path cheap — a per-track `Set<string>` populated during field resolution, flushed once per render pass, should be sufficient. No observable behaviour change for correctly-authored configs.
    fields:
      Group: "Technical"

  - title: "Improve default `dataTooltip` with richer information from adapted payloads"
    labels: ["next"]
    body: |
      **Context**
      When a track has no `kind`, no `dataTooltip`, and no `tooltipOverrides` entry, the resolver synthesizes a minimal `fields` spec from the common feature-shaped record (`type`, `description`, `start`/`begin`, `end`) — see `src/tooltips/resolve.ts`. This is a reasonable floor, but it throws away a lot of information that adapters actually produce into the payload: scores, cross-references, sequence context, consequence types (for variants), AlphaMissense pathogenicity bands, and so on. Authors who haven't yet written a custom `dataTooltip` see a visibly impoverished tooltip compared to the old hard-coded ones, even when the adapter has clearly populated richer fields.

      Goal: make the default tooltip pull more from what's already on the payload (including fields emitted by `calculate` transform steps) so that an out-of-the-box config produces a useful tooltip without the author writing one.

      **Task**
      Expand the default tooltip synthesizer in `src/tooltips/resolve.ts` to surface more of the adapted payload automatically, and render it via the Markdoc path so formatting (links, emphasis) matches custom tooltips.

      **Scope:**
      * Extend the fallback field list beyond `type`/`description`/`start`/`end` to include, where present: `score` (formatted per-kind), `consequenceType`, `clinicalSignificances`, `xrefs` (as linkified names where a source→URL map exists), `evidences` (count + first source), and any fields added by `calculate` steps.
      * Emit the fallback through the Markdoc renderer rather than a flat `<h5>/<p>` grid, so that (a) links become anchors with the same URL-scheme allowlist as author-written tooltips, and (b) the visual treatment matches when authors progressively customize.
      * Preserve the existing precedence: any `tooltipContent` the adapter stashed on the item still wins; any author-written `dataTooltip` still wins over the default.
      * Document the expanded fallback set in `specs/config-approach.md` under the tooltip section (currently ~L869 — "Sensible out-of-the-box fallback"). List the fields surfaced, in what order, and with what formatting.
      * Add a snapshot/DOM test covering: variant record → expected default tooltip, feature record with xrefs → expected default tooltip, minimal feature record → same minimal tooltip as today (no regression).

      **Notes:**
      Keep the fallback compact — this is a safety net, not a replacement for authored tooltips. If the payload has fifteen fields, surface at most ~six; the rest are the author's call to include with an explicit `dataTooltip`. Pick the subset based on which UniProt/AlphaFold/variant adapters actually populate the fields — don't infer from type heuristics alone.
    fields:
      Group: "Technical"
