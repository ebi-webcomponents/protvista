  - title: "Tame Nightingale's click-highlight fill swap on collapsed group aggregate tracks"
    labels: ['next']
    body: |
      **Context**
      Every `<nightingale-track-canvas>` we render — both the collapsed-group aggregate track and each expanded detail track — is mounted with `highlight-event="onclick"`. That attribute opts the track into Nightingale's built-in click-highlight behaviour: clicking a feature swaps its solid fill for a border-only "selected" state, and broadcasts the highlight range via `<nightingale-manager>` so other mounted components can co-highlight the same region.

      This is longstanding Nightingale behaviour — visible on the currently-shipped production viewer at `https://www.uniprot.org/uniprotkb/P05067/feature-viewer`, and present at every point on the config-approach branch we bisected (from `945ca9f` forward). It is not a regression introduced by any commit on the branch.

      The visual effect is functionally correct but perceptually jarring on the collapsed-group aggregate view specifically. The aggregate flattens every child track into a single dense canvas; when a feature is clicked there, the feature at the group-wide scale loses its fill and shows as a hollow outline. In the expanded detail view the same fill-swap happens, but the user's eye reads it as "that feature is selected now" because the context is clearer; in the aggregate view it reads as "something glitched." The most common visible offender is a `BINDING` feature in the `SITES` group's collapsed aggregate, but any feature on any canvas track can trigger it.

      **Task**
      Decide how the collapsed aggregate should visualise a click — keep the Nightingale default, suppress it on the aggregate only, or retheme the selected state to retain a fill. Implement the chosen path and regression-test against the live uniprot.org visual as the reference point.

      **Scope:**
      Three options with different cost/reward profiles; pick one before opening the PR:

      1. **Drop `highlight-event="onclick"` from the aggregate-track render in `getTrack`.** Keep it on the detail-track render. Collapsed clicks then open the tooltip without toggling a selected state, and the feature stays filled. Smallest code change — a single conditional in `src/protvista-uniprot.ts` that threads "is this call rendering an aggregate?" into `getTrack`. Trade-off: cross-track highlight-sync via `<nightingale-manager>` is also disabled for aggregate clicks, so if a click on the aggregate should propagate to the expanded view (not today's UX, but a plausible future one), this path precludes it.

      2. **Retheme the Nightingale selected state via CSS override.** Keep `highlight-event="onclick"` everywhere (preserves manager-driven sync) but target the class/attribute Nightingale writes for the selected feature and restore a fill. Requires inspecting the Nightingale-emitted DOM under DevTools to identify the selector, then adding the override in `src/styles/protvista-styles.ts` under the existing `protvista-uniprot` tag scope. Middle effort. Trade-off: selector is an implementation detail of Nightingale and could break on future upstream upgrades.

      3. **File upstream on Nightingale.** Ask the Nightingale team to expose the selected-state visuals as CSS custom properties (`--nightingale-feature-selected-fill`, `--nightingale-feature-selected-stroke`) so consumers can theme the state without hacking internal selectors. Right answer long-term; timing depends on Nightingale's release cadence. Pair with option 2 as the interim fix while the upstream PR lands.

      Acceptance:

      * The binding-site fill → border-only toggle no longer occurs on the collapsed aggregate view of the `SITES` group (and every other canvas-track group with the same click shape). Verify at `accession=P05067` across all 15 default groups.
      * Click-triggered tooltips still fire on the aggregate track (the fix must not suppress the tooltip).
      * Expanded-view click behaviour is unchanged (features still highlight in their own track, tooltips still open, cross-track manager sync continues to work).
      * A snapshot or DOM test exercising the collapsed-click → feature-element-attributes path so this doesn't silently regress again.

      **Notes:**
      The bisection summary is worth recording for future maintainers: multiple bisection attempts across the config-approach branch (`945ca9f` through HEAD) all landed on commits that either don't touch runtime code (`20016c6`, `f5dcef2`) or touch unrelated runtime paths (`cd3e295` — tooltip arrow borders only). The bug does not originate on this branch; it is a pre-existing Nightingale behaviour that the branch inherits. A fix here is a *visual quirk repair*, not a regression repair.

      Before touching `highlight-event`, verify what manager-driven highlight-sync is actually used for in production. If no consumer depends on a click-in-aggregate triggering a highlight elsewhere, option 1 (strip the attribute from the aggregate) is clean and forward-compatible with either of the other options if the need emerges later. If cross-track sync from the aggregate is ever a requirement, lean on option 2 + 3.

      Side note: the perceptual asymmetry between the collapsed and expanded views also suggests a broader UX question — whether a click on an aggregate-rendered feature should do anything at all beyond open a tooltip, given the feature "lives" on one of the detail tracks. That's out of scope for this issue but worth a separate design conversation if it comes up again.
    fields:
      Group: 'Technical'

  - title: 'Document the canonical React integration pattern (`notooltip` + `change`-event listener)'
    labels: ['next']
    body: |
      **Context**
      `<protvista-uniprot>` is a light-DOM Web Component consumed by React hosts, most prominently uniprot-website. The current React integration pattern — disable the built-in tooltip popover via `notooltip`, listen for `change` events on the element, read `detail.feature.tooltipContent` + `detail.coords`, render a React-controlled overlay positioned at those coordinates — works cleanly and has been in production use. But it is nowhere documented in this repo. A new React adopter today has to reverse-engineer the pattern from consumer code (uniprot-website's `FeatureViewer.tsx`), which is both friction and a correctness hazard (the event shape, attribute name, and dismissal vocabulary are all load-bearing and aren't discoverable from the viewer's types or README).

      This gap became visible during a uniprot-website migration discussion on the config-approach branch. The consumer already uses the event-listening pattern and asked how they are "supposed to" integrate with the new config-approach tooltip pipeline. The answer is simple — add `notooltip`, keep everything else — but that answer doesn't exist as canonical documentation yet.

      **Task**
      Add a "React integration" section to `specs/config-approach.md` (or a standalone page under `docs/`) that codifies the event-listening pattern as the canonical path for React hosts, and cross-link it from the README's API section and from the `tooltips` property's JSDoc on `<protvista-uniprot>`.

      **Scope:**
      * New section in `specs/config-approach.md` titled something like "React host integration" (placement: after the "Intent" section, before "Security and trust model"). Contents:
        - A preamble making the library-vs-consumer split explicit: declarative tooltips (`kind: fields` / `kind: markdown` in YAML, rendered by the library's built-in Floating-UI popover) OR consumer-owned rich tooltips (event listener + host-rendered overlay, with `notooltip` set on the element). There is no in-between — the library does not ship a programmatic per-kind override registry.
        - The `notooltip` attribute — what it does, when to set it, why a React host always wants it. Note that `notooltip` does not suppress `feature.tooltipContent` resolution; it only disables the built-in popover's DOM mount, so a consumer can still read `detail.feature.tooltipContent` off the event if it wants the pre-rendered declarative string.
        - The event-listening pattern:
          - Attach a listener for the `change` event on the `<protvista-uniprot>` element.
          - Inspect `detail.eventType` — `click` opens a tooltip, `mouseover`/`mouseout`/`reset` drive your own hover and dismissal logic.
          - Read `detail.feature` (the full adapter-output item, including any `tooltipContent` the library pre-computed) and `detail.coords` (an `[x, y]` tuple in page coordinates).
          - Render your React overlay into a portal or Floating-UI-positioned div at `[x, y]`. Host owns the JSX, the lifecycle, and the styling.
          - Hide the overlay on `undefined` / `reset` / subsequent `click` events (the dismissal set that uniprot-website uses).
        - A worked minimal React example (no dependencies beyond React itself + Floating UI, roughly 30 lines). The uniprot-website `FeatureViewer.tsx` is the real reference but has a lot of ambient app concerns; a stripped-down example is more digestible for a new adopter.
      * README cross-link: the existing API-section entry for `notooltip` gains a "See [React host integration](…) for the consumer-side pattern." pointer.
      * JSDoc update on the `notooltip` property in `src/protvista-uniprot.ts`: a one-line link to the new spec section, so IDE tooltip-on-hover points the right way.
      * `docs/react-integration.md`: optional second home for the same content, closer to `docs/data-tooltip.md`. Decide between "single source in the spec" vs. "tutorial-flavoured copy in `docs/` and normative contract in the spec" when drafting.

      **Notes:**
      Three things to pin down while writing the section, all surfaced during the original discussion:

      1. **`detail.eventType` value vocabulary.** Current values: `'click'`, `'mouseover'`, `'mouseout'`, `'reset'`. Document every one, including what `reset` means (Nightingale emits it when the user scrolls / zooms, effectively "stop showing any per-feature tooltip"). The set is load-bearing — uniprot-website's `hideTooltipEvents = new Set([undefined, 'reset', 'click'])` assumes all three dismissal triggers.

      2. **`detail.coords` coordinate space.** Document that these are page-coordinates (`clientX` / `clientY`-style) so the consumer knows whether they need to transform to container-local coordinates. Worth sanity-checking against the Nightingale source before committing a statement either way.

      3. **React 19 forward-looking note.** The uniprot-website code has a TODO referencing `ref`-callback-with-cleanup — a React 19 feature that replaces the separate mount/unmount `useEffect` pair. Worth mentioning in the doc as the preferred pattern once React 19 is available, so new adopters don't copy the older split-useEffect shape as the canonical form.

      No code changes in this issue — pure documentation. The existing event-listening integration path works today on the config-approach branch; the gap is that nobody would know from the docs alone that this is the intended path. Estimated effort: half a day to draft, half a day to shake down with a real uniprot-website migration trial run.

      Cross-links with existing next-branch issues:
      * Issue "Tame Nightingale's click-highlight fill swap on collapsed group aggregate tracks" — if that one lands as option 1 (drop `highlight-event="onclick"` from the aggregate), the React integration doc should mention that a click on the collapsed aggregate opens a tooltip *without* a highlight state change, distinct from a click on the expanded detail track.
      * Issue "Add a generic `linegraph` semantic kind for bring-your-own-data authors" — BYOD consumers who pair generic kinds with a React host are the second audience for this doc; worth cross-referencing.
    fields:
      Group: 'Technical'

  - title: "Eliminate `transformedVariants` — lift variation-filter wiring out of the hardcoded `track.id === 'variation'` match"
    labels: ['next']
    body: |
      **Context**
      `<protvista-uniprot>` carries a private field `transformedVariants?: { sequence: string; variants: TransformedVariant[] }` that mirrors the unfiltered variation-track payload. It exists because the variation-filter UI's change handler (`_filterChange` in `src/protvista-uniprot.ts`, around line 972) applies user-selected filters against a pristine baseline, then writes the filtered result back to `this.data['VARIATION-variation']`. Without a separate baseline, subsequent filter interactions would compound — each filter applied to the result of the previous filter rather than to the full list.

      Two symptoms of legacy wiring converge on this field:

      1. **Hardcoded track id.** After every `loadProtvistaData` call, the component walks `this.config.groups` and, for any track with `track.id === 'variation'`, copies `data['${group.id}-${track.id}']` into `this.transformedVariants`. Already flagged by `TODO(#variation-hardcoded)` at ~line 304. A consumer who renames the variation track — a perfectly valid config operation — silently breaks the filter. This tightly couples the filter UI to a specific id string rather than a declarative per-track role.

      2. **Redundant storage.** The baseline exists in two places: `data['VARIATION-variation']` (pre-first-filter-apply) and `this.transformedVariants`. The second copy only exists because the first one gets overwritten by the filter handler. Either we should not overwrite the first, or we shouldn't maintain the second.

      The broader tech-debt theme is "per-track UI roles should be data-driven, not hardcoded." This issue pairs with #5 (`detailOnly` flag) and #10 (URL-template substitution / `data-*` attributes) as the third leg of lifting hardcoded assumptions out of `protvista-uniprot.ts`.

      **Task**
      Replace `transformedVariants` + the `track.id === 'variation'` post-load copy loop with a declarative mechanism on the track config (or a dedicated `this.data` key) that gives the filter handler a pristine baseline without hardcoding the track identity.

      **Scope:**
      Two viable implementation shapes; decide when the work starts:

      * **Shape A — preserve-unfiltered key in `this.data`.** When the loader writes `data['${groupId}-${trackId}']` for a track whose `filterUI === 'nightingale-filter'` (or carries a new explicit `role` flag — see Notes), also write the same payload under `data['${groupId}-${trackId}__unfiltered']` (or similar sentinel suffix). The filter handler reads from the `__unfiltered` key, produces a filtered copy, writes it to the primary key. Zero hardcoded ids anywhere; the filter behaviour follows whichever track opts into `filterUI: 'nightingale-filter'`.

      * **Shape B — filter state separated from data.** The filter handler records `selectedFilters` in a component field; a getter / memoised selector produces the filtered view on demand from the unfiltered source (still `this.data['${groupId}-${trackId}']`, which is never overwritten). Nightingale's variation component consumes the getter result. Cleaner mental model but more intrusive — every reader of `data['VARIATION-variation']` has to route through the getter.

      Shape A is my lean for the first cut: smaller surface-area change, no getter churn, and every existing consumer of `data['VARIATION-variation']` keeps working without edits. Shape B can land later if the getter pattern feels better under real use.

      * Delete `private transformedVariants?` declaration, its constructor init, and the post-load copy loop in the loader wrapper (~20 lines of subtraction).
      * Rewrite `_filterChange` to read from the pristine-copy key (shape A) or the getter (shape B) instead of `this.transformedVariants`.
      * Update the loader's JSDoc — the `transformedVariants` side-effect-preservation comment (currently in `src/load-data.ts` ~L27) goes away; replace with a note that describes whichever mechanism replaces it.
      * Update `src/__spec__/render-target.spec.ts` and any other test fixture that sets `transformedVariants` directly (grep for `transformedVariants` to find).
      * Add a test in `src/__spec__/` covering the filter-change → filtered-data write path against a track whose id is NOT `variation` (e.g. `variants_rna` or `user-defined-variants`), proving the hardcode is gone.
      * Remove the `TODO(#variation-hardcoded)` marker at `src/protvista-uniprot.ts` ~L304 — the fix is this issue's landing condition.

      **Notes:**
      Design decisions to pin down before starting:

      1. **`filterUI === 'nightingale-filter'` as the role signal, or a dedicated `role`/`flag` field?** Using `filterUI` is cheapest — it's already in the schema, already set on the variation track in the default config. Downside: it couples the "I need an unfiltered baseline" contract to the filter-UI component name, which is arguably conflating two concerns. A dedicated `role: 'filterable-list'` (or similar) on `TrackConfig` would be more explicit. Lean `filterUI` first; rename/split later if another role emerges.

      2. **Sentinel suffix for the unfiltered key.** `${key}__unfiltered` is one option. Others: `${key}.pristine`, `${key}:original`, or a separate map (`this.unfilteredData`). Whichever is picked should document the wire-in contract so consumers reading `this.data` directly don't mistake it for live payload.

      3. **Memory cost.** Duplicating the variation payload is fine (variants arrays are typically tens to low thousands of records per protein). If this generalises to other filterable tracks with larger payloads, revisit — but shape A's duplication is cheap for realistic inputs.

      4. **Interaction with issue #5 (`detailOnly`) and #10 (`variables:` / `data-*`).** All three are about lifting hardcoded assumptions out of the component into the declarative schema. They don't conflict but should be sequenced — ideally detailOnly first (smallest, unlocks clean aggregate-inference testing), then this, then the generic variables dict.

      5. **Filter-UI integration beyond variation.** If the fix genuinely de-hardcodes the variation path, a consumer could wire up `filterUI: 'nightingale-filter'` on an RNA-editing or arbitrary features track and get the same behaviour. Worth a sentence in the spec's "Track configuration" section explicitly stating that.

      Zero schema changes required under shape A — the schema already carries `filterUI?` on `TrackConfig`. Pure component-internal wiring cleanup that happens to remove a legacy private field.
    fields:
      Group: 'Technical'

  - title: 'Implement the Vega-Lite-style `transform` pipeline with SQL-WHERE expression strings'
    labels: ['next']
    body: |
      **Context**
      The track-level `filter: "<value>"` shortcut covers every track in the shipped default config by narrowing to a single `type` value (`SIGNAL`, `DOMAIN`, `CHAIN`, …). Consumers bringing their own data will hit the "almost right, just need to tweak" cases the shortcut cannot express: `score >= 0.8 AND type IN ('binding', 'catalytic')`, renaming a column from `desc` to `description`, projecting 40 fields down to 4, capping at N rows, or deriving `length = end - start`. That need is the motivation for a declarative `transform:` pipeline on `DataSourceDescriptor`, modelled on Vega-Lite's transform vocabulary (`filter | calculate | rename | pick | limit`).

      The design is fully specified in [`specs/transform-engine.md`](./specs/transform-engine.md): TypeScript types, JSON Schema additions, a ~250-line hand-rolled SQL-WHERE-flavored expression parser in `src/schema/expressions.ts` (zero runtime dependency, ~2–4 kB gzipped), the engine proper in `src/schema/transforms.ts`, validator + normalizer + loader wire-in, the three test suites, and an implementation plan with acceptance criteria.

      **Task**
      Implement the design in `specs/transform-engine.md` as a single PR.

      **Scope** (brief — see the design doc for the full spec):
      * Extend `src/schema/types.ts` with `Transform`, `FieldPredicate`, `TransformFunction`, `DataSourceDescriptor.transform?:`, and `ProtvistaRuntimeAPI.registerTransform()`.
      * Extend `src/schema/schema.json` with the `Transform` and `FieldPredicate` `$defs` and the `transform:` property on `DataSourceDescriptor`.
      * Extend `src/schema/registry.ts` with a transforms bucket and `BUILTIN_TRANSFORM_OPERATORS`.
      * Re-export the new types + `BUILTIN_TRANSFORM_OPERATORS` from `src/schema/index.ts`.
      * Create `src/schema/expressions.ts` — hand-rolled lexer, recursive-descent parser by precedence level, and AST-to-closure compiler for the SQL-WHERE-flavored grammar (`AND` / `OR` / `NOT`, `=` / `!=` / `<>` / `<` / `<=` / `>` / `>=`, `IN` / `NOT IN`, `BETWEEN` / `NOT BETWEEN`, `LIKE` / `NOT LIKE`, `IS [NOT] NULL`, `+` / `-` / `*` / `/`, dotted-path identifiers, single-quoted strings, number literals, parens).
      * Create `src/schema/transforms.ts` — engine, `applyTransforms()`, `fieldPredicateToFn()`, `registerBuiltinTransforms()`.
      * Extend `src/schema/validate.ts` with `checkTransform()`, the FieldPredicate `anyOf` → `missing-predicate-operator` special-case, and (optional but recommended) parse-time expression validation so authors see typos at config-load instead of track-load.
      * Preserve `transform` in `src/schema/normalize.ts` (`NormalizedDataSource.transform?:` + `expandDescriptor` passthrough).
      * Replace the two inline `.filter(...)` call sites in `src/load-data.ts` with `applyTransforms(...)`. Thread `Registry` through the loader signature and call `registerBuiltinTransforms(registry)` once at loader init.
      * Write the three test suites: `expressions.spec.ts` (lexer + parser precedence + parser errors + evaluator + operator coverage + null safety + dotted paths), `transforms.spec.ts` (engine contract), and restore the transform-vocabulary cases in `schema.spec.ts` / `validate.spec.ts` / `types.spec.ts` / `normalize.spec.ts` / `registry.spec.ts`.
      * Update `specs/config-approach.md`: add the Non-Goals bullet, the Data Model blocks, the Edge Cases rows, the acceptance criteria, and the Example 4 pipeline. See §7 of the design doc for the exact passages.
      * Remove the two planning comments in `src/schema/types.ts` (near line 21) and `src/schema/registry.ts` (near line 38) that point at this issue's design doc.

      **Notes:**
      The design deliberately borrows SQL-WHERE *syntax* and not SQL NULL *semantics*: missing / `undefined` / `null` / `NaN` are all falsy, `IS NULL` matches any of them, `x = NULL` is `false` (two-valued logic). Identifier fields are case-sensitive; keywords are case-insensitive. Strings use single quotes only; `LIKE` uses SQL wildcards (`%` / `_`) compiled to anchored regex. Dotted-path identifiers (`association.disease`, `locations.0.start`) walk the item via the same `readDottedPath` helper the structured `FieldPredicate` already uses — 32-segment depth cap.

      Acceptance hinges on four measurable things: the default UniProt config still loads and renders identically (no one needs to add a `transform:` block); the Example 4 YAML in the design doc validates / loads / renders end-to-end; the track-level `filter: "DOMAIN"` shortcut is output-equal to `transform: [{ filter: { field: "type", equal: "DOMAIN" } }]` (parity test); and the bundle-size delta for the engine + parser stays under 5 kB gzipped.

      No new runtime dependency. No `vega-expression`, no `filtrex`, no full SQL parser — the in-tree parser is the whole thing.
    fields:
      Group: 'Technical'

  - title: 'Surface errors to users instead of silently falling through to the empty-state render'
    labels: ['next']
    body: |
      **Context**
      Every error path in `<protvista-uniprot>` today terminates at `console.warn` or `console.error` and then falls through to the silent "no data" render. A handful of representative failure modes:

      * **Malformed config.** `_init()` catches `ConfigValidationError` at `src/protvista-uniprot.ts` ~L503 and logs `console.error('[protvista-uniprot] Failed to load config.', err)`. The viewer then renders its empty-state branch. The author sees a blank element; the full `issues[]` array with paths and codes (unknown source key, missing-accession, unknown adapter, etc.) is only visible in devtools.
      * **Missing sequence.** `loadEntry()` returns `undefined` or a 4xx body → `console.warn('… loadEntry returned no usable sequence …')` and empty-state render. No visible signal that the identifier was bad or the API was unreachable.
      * **Per-track fetch failure.** The spec's Edge Cases table documents `A url data source returns HTTP 4xx/5xx → The track is silently hidden. A console.warn is emitted. The rest of the viewer renders normally. The group is hidden if all its tracks have no data.` That's the documented contract today — silent hide on failure. Fine for transient network blips, hostile when it's really a bad source-key substitution.
      * **`setTrackData` misuse.** Primitive value rejection, unknown `groupId`/`trackId`, `from: url` track receiving injected data — all warn-and-discard at the console.
      * **`calculate` expression errors** (under the deferred transform engine; see `docs/transform-engine.md`) — one aggregated `console.warn` per track, items get `null`.
      * **`dataTooltip` field-miss** (filed separately as a distinct issue) — silent empty substitution today, planned per-track aggregated `console.warn`.

      The viewer's authoring audience is bench scientists and bioinformaticians writing YAML, not web developers with devtools open. A blank component with no visible diagnostic is the worst possible feedback loop for someone typo-ing a sources key, mis-spelling a `kind:`, or pointing at an unreachable URL. For UniProt-website-style embeds the same errors may need to reach the page's own error-handling surface, not just the component.

      **Task**
      Design and implement a user-facing error-surfacing layer: a visible in-viewer diagnostic panel for mount-level failures, small inline indicators for per-track failures, and an event surface so embedders can pipe errors into their own UI. Preserve the current `console.*` logs as the developer-diagnostic channel — the goal is to add a user channel on top, not replace the existing one.

      **Scope:**
      * **Mount-level error panel.** When `_init()` catches `ConfigValidationError`, render a visible panel (`role="alert"`, `aria-live="polite"`) instead of the silent empty-state. Show a one-line summary ("Config validation failed: 3 issues"), a collapsible list of individual issues with their `path`, `message`, and `code`, and a "Copy to clipboard" action for bug reports. Same treatment for the `loadEntry()` empty-sequence path ("No sequence found for accession 'P05067X'. Check that the identifier is valid and reachable.") and for generic parse errors.
      * **Per-track error indicator.** When a track's URL fetch 4xx/5xxs, keep the current "silently hide" default but add an opt-in `showErrors?: boolean` (on `ProtvistaViewerConfig`, defaulting to `false` in production but `true` in dev bundles / starter-kit configs) that swaps the hide for a small `⚠` badge next to the track label, with the HTTP status and URL visible on hover. Group-level same treatment when all child tracks have failed. The default behaviour stays backward-compatible; the opt-in is the bench-scientist-friendly posture.
      * **`protvista-error` custom event.** Dispatch a bubbling `CustomEvent('protvista-error', { detail: { phase, issues, context } })` whenever an error would reach one of the user-facing surfaces above. Embedders (the UniProt website, for example) can listen and route to their own toast / modal / analytics. `phase` is one of `'config' | 'sequence' | 'track-fetch' | 'set-track-data' | 'transform-calculate' | 'tooltip-field-miss'`. `context` carries the relevant `groupId`/`trackId`/`accession` where applicable. Document the event shape in the spec's escape-hatch section alongside `on()`.
      * **Error-formatting helpers.** A tiny `src/errors/format.ts` module that turns `ConfigValidationError.issues` into a rendering-friendly shape (grouped by path, formatted for display). Tree-shakeable / lazy-loaded so non-error paths don't pay for the formatting code.
      * **A11y.** Error panels carry `role="alert"` (for mount-level) or `role="status"` (for warnings). Focus moves to the alert panel when it appears, with a visible close / dismiss control that returns focus to the previously-focused element. Track-level badges are keyboard-focusable and expose the error detail via `aria-describedby` rather than a native `title` tooltip alone.
      * **Authoring-time "strict" mode.** Optional `ProtvistaViewerConfig.strict?: boolean` that promotes every warning to a mount-failure with the error panel shown — useful during config authoring where you want silent hides to fail loudly. Off by default.
      * **Tests.**
        - `src/__spec__/error-surface.spec.ts` — mounts an element with a malformed config and asserts the error panel renders, the issues are listed, and a `protvista-error` event fires with the right `phase: 'config'`.
        - Mounts with a bogus accession and asserts the sequence-level error panel.
        - Mounts with a real URL that the fetch stub returns 404 for, asserts the per-track badge renders when `showErrors: true` and the silent-hide default when it's not.
        - `setTrackData` misuse fires a `protvista-error` with `phase: 'set-track-data'`.
        - A11y: focus is captured on the error panel; `role="alert"` is set; close button restores focus to the triggering element.

      **Notes:**

      * The visible-panel UI is the load-bearing piece. Without it, "better error reporting" just means "more console noise." Get the panel working against `ConfigValidationError` first (highest-value path — every authoring typo goes through validation), then extend to sequence / per-track / setTrackData.
      * Keep the `console.*` logs. Removing them would regress devtools workflows that the web-dev audience relies on; the goal is an *additional* surface, not a replacement. Route both through a shared reporter so the message text stays in lockstep.
      * The default per-track behaviour has to stay "silently hide" for backward compatibility — `default-config.yaml` relies on this when an adapter's API is transiently down. `showErrors: true` is the opt-in that makes per-track failures visible for dev / authoring contexts.
      * Event phase names should match the `ValidationIssueCode` taxonomy where possible (`unknown-source-key`, `unknown-adapter`, etc.) so embedders can switch on a single stable vocabulary.
      * Coordinate with the `dataTooltip` field-miss warning issue — both should emit through the same `protvista-error` event surface with different `phase` values, so an embedder has one listener to wire up for all error flavours.
      * Bundle cost must stay under ~2 kB gzipped. The panel markup is small; the formatter is the only non-trivial piece. No runtime dep.
      * If the error-panel styling needs to match the viewer's own visual identity, reuse the existing design tokens rather than introducing new CSS variables. The spec's section on CSS classes (see the `pv-`-prefixing issue) is the right place to coordinate.
    fields:
      Group: 'Technical'
