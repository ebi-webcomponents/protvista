# ProtVista UniProt — canonical default viewer configuration.
#
# Migrated from the hard-coded `src/config.ts` as part of the SSI/RSMF
# config-as-data redesign. All 15 existing UniProt groups render
# correctly when driven by the new config format.
#
# Authoring conventions followed in this file:
#
#   • Every track uses the semantic `kind:` field (`features`,
#     `variants`, `confidence-score`, …). No `component` + `adapter`
#     pair at track level — those are resolved by the kind registry.
#   • `filter:` shortcuts replace the legacy per-track filter string.
#     (`filter: SIGNAL` narrows the track's data to items where
#     `type === "SIGNAL"`.)
#   • AlphaFold / AlphaMissense tracks carry no explicit colour scale;
#     the `confidence-score` / `pathogenicity-score` / `pathogenicity-heatmap`
#     kinds apply the canonical `alphafold-ramp` / `alphamissense-ramp`
#     themes for free.
#   • URLs live in the `sources:` map. Tracks reference them by key
#     (`data: features`, `data: { source: [foo, bar] }`) — no URLs
#     embedded in track definitions.
#   • Identifiers follow the spec-recommended casing: UPPER_SNAKE for
#     group ids, lower_snake for track ids. `label:` is kept
#     explicit whenever the legacy config used a human phrase that
#     `titleCaseId()` would not reproduce.

version: '1.0'
# Published JSON Schema for editor autocomplete / inline validation
# (VS Code YAML/JSON extensions resolve $schema automatically). v1 is
# an immutable path once frozen at v5.0.0 GA — see docs/architecture.md's
# src/schema/ table.
$schema: https://ebi-webcomponents.github.io/protvista-uniprot/schema/v1/config.schema.json

# ─────────────────────────────────────────────────────────────
# Named URL templates. `{accession}` is interpolated at mount
# time (the literal braces are not YAML flow syntax here — they
# appear mid-scalar, not at the start, so quoting is unnecessary).
# ─────────────────────────────────────────────────────────────
sources:
  proteins: https://www.ebi.ac.uk/proteins/api/proteins/{accession}
  features: https://www.ebi.ac.uk/proteins/api/features/{accession}
  variation: https://www.ebi.ac.uk/proteins/api/variation/{accession}
  antigens: https://www.ebi.ac.uk/proteins/api/antigen/{accession}
  epitopes: https://www.ebi.ac.uk/proteins/api/epitope/{accession}
  mutagenesis: https://www.ebi.ac.uk/proteins/api/mutagenesis/{accession}
  rnaEditing: https://www.ebi.ac.uk/proteins/api/rna-editing/{accession}
  proteomicsNonPtm: https://www.ebi.ac.uk/proteins/api/proteomics/nonPtm/{accession}
  proteomicsPtm: https://www.ebi.ac.uk/proteins/api/proteomics/ptm/{accession}
  proteomicsHpp: https://www.ebi.ac.uk/proteins/api/proteomics/hpp/{accession}
  interproDomains: https://www.ebi.ac.uk/interpro/wwwapi/entry/all/protein/uniprot/{accession}?type=domain&page_size=100
  alphafoldPrediction: https://alphafold.ebi.ac.uk/api/prediction/{accession}

groups:
  # ───────────────────────────────────────────────────────────
  # 1. Molecule processing — UniProt MOLECULE_PROCESSING features
  # ───────────────────────────────────────────────────────────
  - id: MOLECULE_PROCESSING
    label: Molecule processing
    tracks:
      - id: signal
        label: '{% help slug="signal" %}Signal peptide{% /help %}'
        kind: features
        filter: SIGNAL
        data: features
        description: N-terminal signal peptide

      - id: chain
        label: '{% help slug="chain" %}Chain{% /help %}'
        kind: features
        filter: CHAIN
        data: features
        description: '(aka mature region). This describes the extent of a polypeptide chain in the mature protein following processing'

      - id: transit
        label: '{% help slug="transit" %}Transit peptide{% /help %}'
        kind: features
        filter: TRANSIT
        data: features
        description: This describes the extent of a transit peptide

      - id: init_met
        label: '{% help slug="init_met" %}Initiator methionine{% /help %}'
        kind: features
        filter: INIT_MET
        data: features
        description: This indicates that the initiator methionine is cleaved from the mature protein

      - id: propep
        label: '{% help slug="propep" %}Propeptide{% /help %}'
        kind: features
        filter: PROPEP
        data: features
        description: Part of a protein that is cleaved during maturation or activation

      - id: peptide
        label: '{% help slug="peptide" %}Peptide{% /help %}'
        kind: features
        filter: PEPTIDE
        data: features
        description: The position and length of an active peptide in the mature protein

  # ───────────────────────────────────────────────────────────
  # 2. Sequence information
  # ───────────────────────────────────────────────────────────
  - id: SEQUENCE_INFORMATION
    label: Sequence information
    tracks:
      - id: compbias
        label: '{% help slug="compbias" %}Compositional bias{% /help %}'
        kind: features
        filter: COMPBIAS
        data: features
        description: Position of regions of compositional bias within the protein and the particular amino acids that are over-represented within those regions

      - id: conflict
        label: '{% help slug="conflict" %}Sequence conflict{% /help %}'
        kind: features
        filter: CONFLICT
        data: features
        description: Sequence discrepancies of unknown origin

      - id: non_cons
        label: '{% help slug="non_cons" %}Non-adjacent residues{% /help %}'
        kind: features
        filter: NON_CONS
        data: features
        description: Indicates that two residues in a sequence are not consecutive and that there is an undetermined number of unsequenced residues between them

      - id: non_ter
        label: '{% help slug="non_ter" %}Non-terminal residue{% /help %}'
        kind: features
        filter: NON_TER
        data: features
        description: The sequence is incomplete. The residue is not the terminal residue of the complete protein

      - id: unsure
        label: '{% help slug="unsure" %}Sequence uncertainty{% /help %}'
        kind: features
        filter: UNSURE
        data: features
        description: Regions of a sequence for which the authors are unsure about the sequence assignment

      - id: non_std
        label: '{% help slug="non_std" %}Non-standard residue{% /help %}'
        kind: features
        filter: NON_STD
        data: features
        description: 'Non-standard amino acids (selenocysteine and pyrrolysine)'

  # ───────────────────────────────────────────────────────────
  # 3. Topology
  # ───────────────────────────────────────────────────────────
  - id: TOPOLOGY
    label: Topology
    tracks:
      - id: topo_dom
        label: '{% help slug="topo_dom" %}Topological domain{% /help %}'
        kind: features
        filter: TOPO_DOM
        data: features
        description: Location of non-membrane regions of membrane-spanning proteins

      - id: transmem
        label: '{% help slug="transmem" %}Transmembrane{% /help %}'
        kind: features
        filter: TRANSMEM
        data: features
        description: Extent of a membrane-spanning region

      - id: intramem
        label: '{% help slug="intramem" %}Intramembrane{% /help %}'
        kind: features
        filter: INTRAMEM
        data: features
        description: Extent of a region located in a membrane without crossing it

  # ───────────────────────────────────────────────────────────
  # 4. Domains
  # ───────────────────────────────────────────────────────────
  - id: DOMAINS
    label: Domains
    tracks:
      - id: domain
        label: '{% help slug="domain" %}Domain{% /help %}'
        kind: features
        filter: DOMAIN
        data: features
        description: Specific combination of secondary structures organized into a characteristic three-dimensional structure or fold

      # InterPro representative domains — different endpoint and
      # adapter from the UniProt /features/ stream, expressed as a
      # different semantic kind. The InterPro-specific flattening
      # (`locations[].representative` → synthetic features) happens
      # in the adapter; the features themselves render through the
      # standard `nightingale-track-canvas` component.
      #
      # Id is a display-style string (with spaces) for parity with the
      # pre-migration config — `load-data.ts` uses the id as part of
      # a data-map key, so preserving it byte-for-byte is the safest
      # migration.
      - id: 'InterPro representative domain'
        label: '{% help slug="InterPro_rep_domain" %}InterPro Representative Domain{% /help %}'
        kind: features-interpro
        data: interproDomains
        description: InterPro representative domains

      - id: region
        label: '{% help slug="region" %}Region{% /help %}'
        kind: features
        filter: REGION
        data: features
        description: Regions in multifunctional enzymes or fusion proteins, or characteristics of a region, e.g., protein-protein interactions mediation

      - id: repeat
        label: '{% help slug="repeat" %}Repeat{% /help %}'
        kind: features
        filter: REPEAT
        data: features
        description: Repeated sequence motifs or repeated domains within the protein

      - id: motif
        label: '{% help slug="motif" %}Motif{% /help %}'
        kind: features
        filter: MOTIF
        data: features
        description: Short conserved sequence motif of biological significance

      - id: zn_fing
        label: '{% help slug="zn_fing" %}Zinc finger{% /help %}'
        kind: features
        filter: ZN_FING
        data: features
        description: Small, functional, independently folded domain that coordinates one or more zinc ions

  # ───────────────────────────────────────────────────────────
  # 5. Sites
  # ───────────────────────────────────────────────────────────
  - id: SITES
    label: Sites
    tracks:
      - id: metal
        label: '{% help slug="binding" %}Metal binding{% /help %}'
        kind: features
        filter: METAL
        data: features
        description: Binding site for a metal ion

      - id: site
        label: '{% help slug="site" %}Site{% /help %}'
        kind: features
        filter: SITE
        data: features
        description: Any interesting single amino acid site on the sequence

      - id: ca_bind
        label: '{% help slug="binding" %}Calcium binding{% /help %}'
        kind: features
        filter: CA_BIND
        data: features
        description: Calcium-binding regions, such as the EF-hand motif

      - id: dna_bind
        label: '{% help slug="dna_bind" %}DNA binding{% /help %}'
        kind: features
        filter: DNA_BIND
        data: features
        description: DNA-binding domains such as AP2/ERF domain, the ETS domain, the Fork-Head domain, the HMG box and the Myb domain

      - id: np_bind
        label: '{% help slug="binding" %}Nucleotide binding{% /help %}'
        kind: features
        filter: NP_BIND
        data: features
        description: '(aka flavin-binding). Region in the protein which binds nucleotide phosphates'

      - id: binding
        label: '{% help slug="binding" %}Binding site{% /help %}'
        kind: features
        filter: BINDING
        data: features
        description: 'Binding site for any chemical group (co-enzyme, prosthetic group, etc.)'

      - id: act_site
        label: '{% help slug="act_site" %}Active site{% /help %}'
        kind: features
        filter: ACT_SITE
        data: features
        description: Amino acid(s) directly involved in the activity of an enzyme

  # ───────────────────────────────────────────────────────────
  # 6. PTM (post-translational modifications)
  # ───────────────────────────────────────────────────────────
  - id: PTM
    label: PTM
    tracks:
      - id: mod_res
        label: '{% help slug="mod_res" %}Modified residue{% /help %}'
        kind: features
        filter: MOD_RES
        data: features
        description: Modified residues such as phosphorylation, acetylation, acylation, methylation

      # Large-scale MS PTM data — different endpoint, different kind
      # (peptides-ptm → proteomics-ptm adapter).
      - id: mod_res_ls
        label: '{% help slug="mod_res_large_scale" %}Modified residue (large scale data){% /help %}'
        kind: peptides-ptm
        filter: MOD_RES_LS
        data: proteomicsPtm
        description: Modified residues from Large scale studies

      - id: carbohyd
        label: '{% help slug="carbohyd" %}Glycosylation{% /help %}'
        kind: features
        filter: CARBOHYD
        data: features
        description: 'Covalently attached glycan group(s)'

      - id: disulfid
        label: '{% help slug="disulfid" %}Disulfide bond{% /help %}'
        kind: features
        filter: DISULFID
        data: features
        description: The positions of cysteine residues participating in disulphide bonds

      - id: crosslnk
        label: '{% help slug="crosslnk" %}Cross-link{% /help %}'
        kind: features
        filter: CROSSLNK
        data: features
        description: Covalent linkages of various types formed between two proteins or between two parts of the same protein

      - id: lipid
        label: '{% help slug="lipid" %}Lipidation{% /help %}'
        kind: features
        filter: LIPID
        data: features
        description: 'Covalently attached lipid group(s)'

  # ───────────────────────────────────────────────────────────
  # 7. Epitopes
  # ───────────────────────────────────────────────────────────
  - id: EPITOPE
    label: Epitopes
    tracks:
      - id: epitope
        label: '{% help slug="epitopes" %}Epitope{% /help %}'
        kind: features
        data: epitopes

  # ───────────────────────────────────────────────────────────
  # 8. Antigenic sequences
  # ───────────────────────────────────────────────────────────
  - id: ANTIGEN
    label: Antigenic sequences
    tracks:
      - id: antigen
        label: '{% help slug="Antibody_binding_sequences" %}Antibody binding sequences{% /help %}'
        kind: features
        data: antigens

  # ───────────────────────────────────────────────────────────
  # 9. Mutagenesis
  # ───────────────────────────────────────────────────────────
  - id: MUTAGENESIS
    label: Mutagenesis
    tracks:
      - id: mutagen
        label: '{% help slug="mutagen" %}Mutagenesis{% /help %}'
        kind: features
        filter: MUTAGEN
        data: features
        description: Site which has been experimentally altered by mutagenesis

      - id: othermutagen
        label: '{% help slug="mutagen" %}Mutagenesis (large scale data){% /help %}'
        kind: features
        data: mutagenesis
        description: Site which has been experimentally altered by mutagenesis

  # ───────────────────────────────────────────────────────────
  # 10. Variants (graph + detail track pair)
  # ───────────────────────────────────────────────────────────
  - id: VARIATION
    label: '{% help slug="variant_viewer" %}Variants{% /help %}'
    # Explicit because the two child kinds (`variant-counts` +
    # `variants`) resolve to different components — without this,
    # the collapsed-group aggregate view would fall back to
    # `nightingale-track-canvas`, breaking parity with the legacy
    # viewer's linegraph aggregate.
    component: nightingale-linegraph-track
    tracks:
      - id: variation_graph
        label: Counts
        kind: variant-counts
        data: variation
        description: Natural variant of the protein, including polymorphisms, variations between strains, isolates or cultivars, disease-associated mutations and RNA editing events

      - id: variation
        kind: variants
        data: variation
        filterUI: nightingale-filter
        description: Natural variant of the protein, including polymorphisms, variations between strains, isolates or cultivars, disease-associated mutations and RNA editing events

  # ───────────────────────────────────────────────────────────
  # 11. RNA editing (graph + detail track pair)
  # ───────────────────────────────────────────────────────────
  - id: RNA_EDITING
    label: '{% help slug="rna_editing" %}RNA Editing{% /help %}'
    # Explicit: `rna-editing-counts` (linegraph) + `rna-editing`
    # (track-canvas) are mixed, so the collapsed-group aggregate
    # needs an explicit component to match the legacy linegraph.
    component: nightingale-linegraph-track
    tracks:
      - id: rna_editing_graph
        label: Counts
        kind: rna-editing-counts
        data: rnaEditing
        description: RNA editing events leading to one or more amino acid changes compared to the translation of the non-edited RNA version.

      # Id preserved verbatim (including the space and capitalisation)
      # for parity with the pre-migration config — the legacy track's
      # `name` was the display-style `"RNA Editing"`, and the
      # `${group.name}-${track.name}` key the renderer builds must
      # keep working for external consumers that may be watching for
      # specific track keys. Label omitted on purpose; the normalizer
      # will synthesise one from the id.
      - id: 'RNA Editing'
        kind: rna-editing
        data: rnaEditing
        description: RNA editing events leading to one or more amino acid changes compared to the translation of the non-edited RNA version.

  # ───────────────────────────────────────────────────────────
  # 12. Proteomics
  # ───────────────────────────────────────────────────────────
  - id: PROTEOMICS
    label: Proteomics
    tracks:
      - id: unique
        label: '{% help slug="proteomics#1-data-from-public-mass-spectrometry-based-proteomics-resources" %}Unique peptide{% /help %}'
        kind: peptides
        filter: unique
        data: proteomicsNonPtm

      - id: non_unique
        label: '{% help slug="proteomics#1-data-from-public-mass-spectrometry-based-proteomics-resources" %}Non-unique peptide{% /help %}'
        kind: peptides
        filter: non_unique
        data: proteomicsNonPtm

      - id: hpp
        label: '{% help slug="proteomics#3-human-proteome-project" %}Human proteome project{% /help %}'
        kind: peptides
        data: proteomicsHpp

      # Id preserved as `proteomics-ptm` (hyphen) for parity with the
      # pre-migration config — the legacy used mixed underscore /
      # hyphen casing across track ids, and keeping the string stable
      # avoids breaking external consumers that might be watching for
      # specific data-map keys.
      - id: 'proteomics-ptm'
        label: '{% help slug="proteomics#4-post-translational-modification-ptm-data-derived-from-large-scale-mass-spectrometry-ms-datasets" %}PTM-containing peptide{% /help %}'
        kind: peptides
        data: proteomicsPtm

  # ───────────────────────────────────────────────────────────
  # 13. PDBe structure coverage
  # ───────────────────────────────────────────────────────────
  - id: STRUCTURE_COVERAGE
    label: PDBe 3D structure coverage
    tracks:
      - id: pdbe_cover
        label: '{% help slug="structure_section#structure-coverage" %}PDBe coverage{% /help %}'
        kind: structure-coverage
        data: proteins
        description: PDBe 3D structure coverage

  # ───────────────────────────────────────────────────────────
  # 14. AlphaFold confidence
  # The `confidence-score` semantic kind carries the canonical
  # AlphaFold pLDDT colour ramp (`alphafold-ramp`) — no explicit
  # `rendering.colorScale` needed.
  # ───────────────────────────────────────────────────────────
  - id: ALPHAFOLD_CONFIDENCE
    label: '{% help slug="structure_section#alphafold-structural-models" %}AlphaFold{% /help %}'
    # Explicit group-level rendering so the collapsed aggregate
    # view uses the same AlphaFold ramp as the per-track coloured
    # sequence. The child track's `confidence-score` kind already
    # carries this preset at track level; repeating it here keeps
    # parity with the legacy config, whose group block had
    # `scale:` / `color-range:` attributes inlined.
    rendering:
      colorScale:
        theme: alphafold-ramp
    tracks:
      - id: alphafold_confidence
        label: '[AlphaFold Confidence](https://alphafold.ebi.ac.uk/entry/{accession})'
        kind: confidence-score
        data:
          source: [alphafoldPrediction, proteins]
        description: AlphaFold prediction confidence

  # ───────────────────────────────────────────────────────────
  # 15. AlphaMissense pathogenicity
  # `pathogenicity-score` / `pathogenicity-heatmap` kinds apply the
  # `alphamissense-ramp` theme automatically.
  # ───────────────────────────────────────────────────────────
  - id: ALPHAMISSENSE_PATHOGENICITY
    label: '{% help slug="structure_section#alphamissense-prediction-of-genetic-variation-consequence-in-the-feature-viewer" %}AlphaMissense{% /help %}'
    # Explicit component + rendering for parity: the two child kinds
    # (`pathogenicity-score` → coloured-sequence, `pathogenicity-heatmap`
    # → sequence-heatmap) are mixed, so the collapsed aggregate
    # would otherwise default to `nightingale-track-canvas` without
    # a colour ramp.
    component: nightingale-colored-sequence
    rendering:
      colorScale:
        theme: alphamissense-ramp
    tracks:
      - id: alphamissense_pathogenicity
        label: Average Pathogenicity Score
        kind: pathogenicity-score
        data:
          source: [alphafoldPrediction, proteins]
        description: AlphaMissense pathogenicity

      - id: alphamissense_pathogenicity_heatmap
        label: '[AlphaMissense Pathogenicity](https://alphafold.ebi.ac.uk/entry/{accession})'
        kind: pathogenicity-heatmap
        data:
          source: [alphafoldPrediction, proteins]
        description: AlphaMissense pathogenicity
