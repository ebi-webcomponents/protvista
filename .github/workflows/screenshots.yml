name: Screenshots

# Documentation screenshots are a build artefact (see scripts/screenshots/), but
# they are *committed* binaries, so this workflow deliberately does not
# regenerate them on every push: an automated job committing PNGs produces noisy
# diffs and merge conflicts on unrelated work.
#
# Instead:
#   - `regenerate` (manual)  — the canonical generator. Runs on Linux and opens
#     a PR with whatever changed. Use it after a UI change or before a release.
#   - `check` (pull request) — tells a reviewer "the UI moved and the docs
#     images no longer match". Advisory only; see the tolerance note below.
#
# NOTE: `workflow_dispatch` only becomes available once this file exists on the
# repository's default branch (`main`). `publish-starter-kit.yml` hit exactly
# this and returned HTTP 422 until it was triggered by its `release` event
# instead.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated shot ids (blank = all)'
        type: string
        default: ''
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/screenshots/**'
      - 'docs/src/**'

permissions:
  contents: read

jobs:
  check:
    name: Check for drift
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Advisory. Font rasterisation differs between the machine that generated
    # the committed images and this runner, so a strict failure here would
    # block unrelated work on noise. A reviewer reads the annotation and
    # decides whether to run `regenerate`.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Some environments block cdn.playwright.dev. Skip rather than fail: this
      # job is advisory, and a missing browser is not a code problem.
      - name: Install Playwright browser
        id: browser
        continue-on-error: true
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Compare against the committed images
        if: steps.browser.outcome == 'success'
        run: yarn screenshots:check

  regenerate:
    name: Regenerate and open a PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Capture
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            yarn screenshots --only="${{ inputs.only }}"
          else
            yarn screenshots
          fi

      # Guards the relationship between the images and the prose beside them.
      - name: Verify the docs still agree with the manifest
        run: yarn vitest run --project unit scripts/screenshots/screenshots-doc.spec.mjs

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: screenshots/regenerate
          title: 'Regenerate documentation screenshots'
          commit-message: 'Regenerate documentation screenshots'
          body: |
            Generated by the Screenshots workflow.

            Review the images themselves, not just the diff stat: a changed
            screenshot means the UI changed, and the prose beside it may need
            to change too.
          add-paths: |
            docs/src/assets/screenshots/**
