name: Screenshots

# Documentation screenshots are a build artefact (see scripts/screenshots/), but
# they are *committed* binaries, so this workflow deliberately does not
# regenerate them on every push: an automated job committing PNGs produces noisy
# diffs and merge conflicts on unrelated work.
#
# Instead:
#   - `regenerate` (manual)  — the canonical generator. Runs on Linux and opens
#     a PR with whatever changed. Use it after a UI change or before a release.
#   - `check` (pull request) — tells a reviewer "the UI moved and the docs
#     images no longer match". Drift is advisory (see the tolerance note on the
#     job below); a shot that could not be captured at all fails the job. It
#     reports how much of each image moved and uploads a committed/fresh/diff
#     strip as an artifact, because the number alone cannot separate a real
#     change from rasterisation noise.
#
# NOTE: `workflow_dispatch` only becomes available once this file exists on the
# repository's default branch (`main`). `publish-starter-kit.yml` hit exactly
# this and returned HTTP 422 until it was triggered by its `release` event
# instead.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated shot ids (blank = all)'
        type: string
        default: ''
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/screenshots/**'
      - 'docs/src/**'

permissions:
  contents: read

jobs:
  check:
    name: Check for drift
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Some environments block cdn.playwright.dev. Skip rather than fail: this
      # job is advisory, and a missing browser is not a code problem.
      - name: Install Playwright browser
        id: browser
        continue-on-error: true
        run: npx playwright install --with-deps chromium chromium-headless-shell

      # Drifted images are advisory; a harness that cannot capture at all is
      # not. Font rasterisation differs between the machine that generated the
      # committed images and this runner — measured at 1.8% of pixels on
      # `tutorial-standalone-csv`, every one of them inside a glyph, with the
      # tracks and rulers byte-identical — so failing on drift would block
      # unrelated work on noise: a reviewer reads the annotation, opens the
      # `screenshot-drift` artifact and decides whether to run `regenerate`.
      # But exit 1 means a shot could not be captured — an unpinned request, a
      # page error, a viewer that rendered empty. That is a real breakage in
      # the code or the fixtures, it blocks regenerating any image, and burying
      # it in a green check is how `mappings/uniprot/9UMH` went unnoticed.
      - name: Compare against the committed images
        if: steps.browser.outcome == 'success'
        run: |
          set +e
          yarn screenshots:check
          code=$?
          set -e
          if [ "$code" = 2 ]; then
            echo "::warning::Documentation screenshots drifted — see the screenshot-drift artifact, then run the Screenshots workflow to regenerate."
            exit 0
          fi
          exit "$code"

      # The percentage in the log says how much moved; only the picture says
      # what. Each `<id>.compare.png` is the committed image, the fresh one and
      # the difference joined into one strip — drift that traces every glyph and
      # leaves the tracks untouched is rasterisation, not a UI change.
      # `always()` because the step above exits non-zero precisely when there is
      # something to upload.
      - name: Upload the drift evidence
        if: always() && steps.browser.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-drift
          path: screenshot-drift/
          if-no-files-found: ignore
          retention-days: 14

  regenerate:
    name: Regenerate and open a PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Capture
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            yarn screenshots --only="${{ inputs.only }}"
          else
            yarn screenshots
          fi

      # Guards the relationship between the images and the prose beside them.
      - name: Verify the docs still agree with the manifest
        run: yarn vitest run --project unit scripts/screenshots/screenshots-doc.spec.mjs

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: screenshots/regenerate
          title: 'Regenerate documentation screenshots'
          commit-message: 'Regenerate documentation screenshots'
          body: |
            Generated by the Screenshots workflow.

            Review the images themselves, not just the diff stat: a changed
            screenshot means the UI changed, and the prose beside it may need
            to change too.
          add-paths: |
            docs/src/assets/screenshots/**
