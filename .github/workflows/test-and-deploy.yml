name: Test and Deploy

on:
  push:
  pull_request:

# GitHub Pages is deployed from the `next` branch only (see its own
# workflow). `main` must not deploy Pages, or a push here overwrites the v5
# docs site with the old 4.x demo. So this workflow only tests and builds;
# it no longer needs the pages/id-token write scopes.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn test:lint

      - name: Type check
        run: yarn test:types

      - name: Unit tests
        run: yarn test:unit

      - name: Coverage threshold
        run: yarn test:coverage

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build
