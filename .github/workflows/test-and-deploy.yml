name: Test and Deploy

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn test:lint

      - name: Type check
        run: yarn test:types

      - name: Unit tests
        run: yarn test:unit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Coverage (both unit and browser tests, enforces thresholds)
        run: yarn test:coverage

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # `moduleResolution: "bundler"` + `skipLibCheck` means nothing in the
      # test job resolves this package the way a consumer will. publint and
      # attw do, against the real tarball — they are the only guard on the
      # exports map, `type`, and the emitted declarations. `test:pack` builds
      # first (`yarn build && …`), so it owns the build for the steps below;
      # a separate Build step would only rebuild the same output.
      - name: Check published package
        run: yarn test:pack

      # The dist/ assertions in package-contract.spec.ts skip unless a build
      # exists; the test job never builds, so run them here against the dist/
      # that the step above produced.
      - name: Verify packaging contract against dist/
        run: yarn vitest run --project unit src/__spec__/package-contract.spec.ts

      # Builds the Astro + Starlight docs (incl. the playground page) + the bench
      # page into site/. Requires astro, @astrojs/starlight, astro-mermaid,
      # mermaid and sharp in devDependencies.
      - name: Build site
        if: github.ref == 'refs/heads/next' && github.event_name == 'push'
        run: yarn site:build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/next' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/next' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
