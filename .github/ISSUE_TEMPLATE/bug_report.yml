name: Bug report
description: Something in ProtVista doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: >
        Steps, a code snippet, or a link to a page where the problem is
        visible. If you use a custom configuration (config-src / config
        property), please include it.
      placeholder: |
        1. Embed <protvista-uniprot accession="...">
        2. ...
    validations:
      required: true
  - type: input
    id: accession
    attributes:
      label: UniProt accession (if relevant)
      placeholder: P05067
  - type: input
    id: version
    attributes:
      label: protvista-uniprot version
      placeholder: e.g. 4.9.4, or "latest from CDN"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Firefox 128 on Ubuntu 24.04
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Any errors or warnings from the browser console.
      render: text
