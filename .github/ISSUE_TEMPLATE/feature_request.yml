name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How do you imagine this working? Mockups, config sketches, and links to prior art are welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Viewer configuration / data loading
        - Tracks and rendering
        - Styling / theming
        - Accessibility
        - Documentation / Starter Kit
        - Other
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this
