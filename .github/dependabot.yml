version: 2
updates:
  # The workflow pins actions to commit SHAs, which do not receive security
  # or feature updates on their own. Let Dependabot open PRs that advance each
  # pin (and its trailing `# vX` comment) as new releases ship.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a newly published version, so a freshly
    # compromised or broken release is not adopted the day it lands.
    cooldown:
      default-days: 7

  # devDependencies are exact-pinned and runtime deps use caret ranges; let
  # Dependabot advance both (lockfile security bumps included). Dev minor/patch
  # updates are grouped into one PR to cap noise; the same 7-day cooldown
  # applies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
